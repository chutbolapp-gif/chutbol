<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050D20">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chutbol</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Russo+One&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEF7;--bg2:#D6E0EE;--panel:#FFFFFF;--panel2:#F1F5FB;--line:#C9D5E6;
  --text:#0B1A3A;--muted:#55678A;--accent:#0B6BD3;--accentInk:#FFFFFF;
  --gold:#B07D00;--silver:#7C8798;--good:#178A48;--bad:#D23A3A;
  --flood:rgba(11,107,211,.10);--shadow:0 6px 24px rgba(11,26,58,.10);
  --pitch1:#2F8F3E;--pitch2:#37A047;--chalk:rgba(255,255,255,.85);
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050D20;--bg2:#0A1835;--panel:#0E2148;--panel2:#132a58;--line:#1F3B74;
    --text:#EAF1FF;--muted:#8EA3C9;--accent:#55C2FF;--accentInk:#04122B;
    --gold:#F2C14E;--silver:#C3CCDA;--good:#3DDC84;--bad:#FF5F63;
    --flood:rgba(85,194,255,.13);--shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050D20;--bg2:#0A1835;--panel:#0E2148;--panel2:#132a58;--line:#1F3B74;
  --text:#EAF1FF;--muted:#8EA3C9;--accent:#55C2FF;--accentInk:#04122B;
  --gold:#F2C14E;--silver:#C3CCDA;--good:#3DDC84;--bad:#FF5F63;
  --flood:rgba(85,194,255,.13);--shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root{--board1:#0B1838;--board2:#081128;--boardLine:#1F3B74;--stripes:none}
:root[data-theme="dark"][data-skin="grass"]{
  --bg:#06160C;--bg2:#0C2A16;--panel:#0F2E19;--panel2:#153B21;--line:#235A33;
  --text:#ECF8EF;--muted:#9DC4A8;--accent:#C2F23C;--accentInk:#0B1A06;
  --gold:#F2C94E;--silver:#CFD8D2;--good:#5BE38B;--bad:#FF6A5F;
  --flood:rgba(194,242,60,.10);--board1:#0F2E19;--board2:#07180D;--boardLine:#235A33;
  --stripes:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 70px,transparent 70px 140px)}
:root[data-theme="dark"][data-skin="ucl"]{
  --bg:#07052A;--bg2:#160E5A;--panel:#160F4E;--panel2:#1F166A;--line:#33298E;
  --text:#F1F0FF;--muted:#A9A3D9;--accent:#00D1FF;--accentInk:#06042A;
  --gold:#F2C14E;--silver:#D2D0EA;--good:#3DDC84;--bad:#FF5F7A;
  --flood:rgba(0,209,255,.12);--board1:#1A1160;--board2:#0B0738;--boardLine:#33298E;
  --stripes:radial-gradient(1.5px 1.5px at 20% 30%,rgba(255,255,255,.5),transparent),radial-gradient(1.5px 1.5px at 70% 15%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 45% 60%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 85% 45%,rgba(255,255,255,.35),transparent)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;font-family:var(--body);color:var(--text);font-size:16px;line-height:1.45;
  background:var(--stripes),
    radial-gradient(120% 60% at 15% -10%,var(--flood),transparent 60%),
    radial-gradient(120% 60% at 85% -10%,var(--flood),transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg) 420px);
  background-color:var(--bg);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}
#app{max-width:640px;margin:0 auto;padding:12px 14px 110px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15}
h1{font-size:30px}
h2{font-size:22px}
h3{font-size:19px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.spacer{height:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;min-height:48px;background:var(--accent);color:var(--accentInk);font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.soft{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.gold{background:var(--gold);color:#1a1200}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:14px;width:48px;height:48px;display:inline-grid;place-items:center;color:var(--text)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:48px;border-radius:13px;border:1.5px solid var(--line);background:var(--panel2);padding:10px 14px;font-size:16px}
textarea{min-height:110px;resize:vertical}
label.f{display:block;margin:12px 0 6px;font-weight:700;font-size:14px;color:var(--muted)}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.top .ttl{flex:1;min-width:0}
.top .ttl h1{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:clamp(18px,5.6vw,26px);line-height:1.15;word-break:break-word}
.brand{font-family:var(--display);font-size:15px;color:var(--accent);display:flex;align-items:center;gap:6px}
.modebar{font-size:13px;color:var(--muted);background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}

/* home */
.hero{padding:26px 4px 8px}
.hero h1{font-size:44px;letter-spacing:-.5px}
.hero p{margin:6px 0 0;color:var(--muted);font-size:17px}
.league{display:flex;align-items:center;gap:14px;width:100%;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}
.league .crest{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff 0 18%,transparent 19%),conic-gradient(var(--accent),var(--gold),var(--accent));font-size:24px;flex:none}
.league b{font-family:var(--display);font-weight:400;font-size:21px;display:block}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{appearance:none;background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted);min-height:60px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 14px;min-height:42px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.chip .gk{font-size:13px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.18) inset;flex:none}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.2) inset}
.colors button.on{border-color:var(--text);transform:scale(1.12)}
.team{border-inline-start:6px solid var(--c)}
.team .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.team .head b{font-family:var(--display);font-weight:400;font-size:20px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:14px;padding:8px 10px 8px 8px;margin:8px 0}
.stepper b{font-weight:700}
.stepper .ctl{display:flex;align-items:center;gap:10px}
.stepper .val{font-family:var(--display);font-size:24px;min-width:28px;text-align:center}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:700;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 4px;text-align:center;border-bottom:1px solid var(--line);font-size:15px}
.tbl tr:last-child td{border-bottom:0}
.tbl .nm{text-align:right;font-weight:700}
.tbl .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tbl .pts{font-family:var(--display);font-size:20px}
.tbl .pos{font-family:var(--display);font-size:17px;width:28px}
.tbl tr.p1 .pos{color:var(--gold)}
.tbl tr.p2 .pos{color:var(--silver)}
.tbl tr.click{cursor:pointer}
.scroll{overflow-x:auto}

.kings{display:grid;gap:12px}
.king li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.king ol{list-style:none;margin:0;padding:0}
.king li:last-child{border-bottom:0}
.king .n{font-family:var(--display);width:22px;color:var(--muted)}
.king li:first-child .n{color:var(--gold)}
.king .v{font-family:var(--display);font-size:20px;margin-inline-start:auto}
.empty{color:var(--muted);padding:6px 0}

/* scoreboard */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 10px;border-radius:18px;background:linear-gradient(180deg,var(--board1),var(--board2));color:#EAF1FF;border:1px solid var(--boardLine)}
.board .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.board .tn{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;max-width:100%}
.board .tn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flip{font-family:var(--display);font-size:46px;line-height:1;background:linear-gradient(180deg,#1b2333 0 49%,#0e1420 51%);color:#fff;border-radius:10px;padding:8px 14px;min-width:62px;text-align:center;box-shadow:0 3px 0 #000,inset 0 0 0 1px #2d3a55;position:relative}
.flip::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#05080f}
.clock{font-family:var(--display);font-size:40px;color:#FF4B4B;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.clock.ok{color:#FF4B4B}
.clock.over{color:#FFB020}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.mid small{color:#9FB2D6;font-size:12.5px}

/* pitch */
.pitch{position:relative;margin:8px 0;border-radius:16px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch1) 0 9%,var(--pitch2) 9% 18%);
  border:3px solid #24702f;height:clamp(320px,calc(100vh - 330px),560px);height:clamp(320px,calc(100dvh - 330px),560px);display:flex;flex-direction:column}
.pitch .lines{position:absolute;inset:10px;border:2px solid var(--chalk);border-radius:4px;pointer-events:none}
.pitch .lines::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--chalk)}
.pitch .lines::after{content:"";position:absolute;left:50%;top:50%;width:84px;height:84px;border:2px solid var(--chalk);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .box{position:absolute;left:24%;right:24%;height:12%;border:2px solid var(--chalk);pointer-events:none}
.pitch .box.t{top:10px;border-top:0}
.pitch .box.b{bottom:10px;border-bottom:0}
.half{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:6px 4px;z-index:1;min-height:0}
.half.b{flex-direction:column-reverse}
.prow{display:flex;justify-content:space-around;gap:4px}
.prow.r5{gap:0}.prow.r5 .tok{width:20%;max-width:72px}.prow.r5 .tok .nm{font-size:11px;padding:1px 4px;max-width:100%}
.tok{appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;width:74px;padding:0;position:relative}
.av{width:42px;height:42px;border-radius:50%;background:#EEF2F8;color:#0B1A3A;display:grid;place-items:center;font-family:var(--display);font-size:16px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.tok .av{box-shadow:0 0 0 3px var(--c),0 3px 8px rgba(0,0,0,.35)}
.av.mini{width:30px;height:30px;font-size:12px;box-shadow:0 0 0 1px var(--line)}
.av.big{width:76px;height:76px;font-size:28px;box-shadow:0 0 0 3px var(--accent)}
.tok .nm{background:rgba(5,12,28,.82);padding:1px 6px;border-radius:6px;font-size:12px;font-weight:700;max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .bdg{position:absolute;top:-6px;left:4px;display:flex;gap:2px}
.tok .bdg span{background:#0B1838;color:#fff;border-radius:999px;font-size:11.5px;padding:1px 6px;font-weight:800;border:1px solid #2c4680}
.tok .gkt{position:absolute;top:-6px;right:10px;background:#FFD54A;color:#2a1d00;border-radius:999px;font-size:11px;font-weight:800;padding:1px 6px}
.tok:disabled{cursor:default}
.ctrls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ctrls .btn{padding:10px 6px;font-size:15px}
.top.c{padding:2px 0 6px}.top.c h1{font-size:22px}.top.c .iconbtn{width:42px;height:42px}
.board.c{padding:8px 8px}.board.c .flip{font-size:36px;padding:6px 10px;min-width:50px}.board.c .clock{font-size:32px}
.tbtn{appearance:none;border:1px solid #2c4680;background:#13244a;color:#EAF1FF;border-radius:999px;padding:6px 14px;min-height:36px;font-weight:800;font-size:14px;margin-top:4px}
.tbtn.run{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
.warn{color:var(--bad);font-weight:700;font-size:14px}
.livetag{display:inline-block;background:var(--bad);color:#fff;border-radius:6px;font-size:11px;font-weight:800;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}
.evlist{list-style:none;margin:0;padding:0}
.evlist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.evlist li:last-child{border-bottom:0}
.evlist .min{font-family:var(--display);color:var(--muted);width:34px}

.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.mlist li:last-child{border-bottom:0}
.mlist .t{display:flex;align-items:center;gap:6px;font-weight:700;min-width:0}
.mlist .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlist .t.a{justify-content:flex-end}
.mlist .sc{font-family:var(--display);font-size:20px;min-width:62px;text-align:center}
.mlist .mt{display:block;text-align:center;font-size:12px;color:var(--muted)}
.evlist .at{font-size:12px;color:var(--muted);white-space:nowrap}
.vt{font-family:var(--display);font-size:15px;white-space:nowrap;color:var(--accent)}
a.btn{text-decoration:none}
.recdot{color:#FF4B4B}
.pbar{height:10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:12px 0}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.hlvid{width:100%;border-radius:14px;background:#000;display:block}
.rate{font-family:var(--display);min-width:46px;text-align:center;border-radius:10px;padding:3px 8px;background:var(--panel2);border:1px solid var(--line);flex:none}
.rate.hi{color:var(--good);border-color:var(--good)}.rate.lo{color:var(--bad)}
.mvp{background:color-mix(in srgb,var(--gold) 12%,var(--panel))}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rcol{min-width:0;background:var(--panel2);border-radius:12px;padding:6px;border-top:4px solid var(--c)}
.rhead{display:flex;align-items:center;gap:6px;padding:4px 4px 8px;font-size:15px;min-width:0}
.rhead b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 4px;border-top:1px solid var(--line);font-size:14.5px}
.rrow .rn{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.rrow .rate{min-width:40px;padding:2px 6px;font-size:15px}
.rrow.mvp{background:color-mix(in srgb,var(--gold) 15%,transparent);border-radius:8px}
.gkb{display:inline-block;background:#FFD54A;color:#2a1d00;border-radius:999px;font-size:11px;font-weight:800;padding:0 5px;margin-inline-end:4px}
.rfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;background:linear-gradient(180deg,#0B1838,#081128);color:#EAF1FF;font-weight:700}
.rfoot b{font-family:var(--display);font-size:22px;font-weight:400;white-space:nowrap}
.rfoot>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mom{text-align:center;margin:10px 0 0;color:var(--gold)}
.fcard{border-radius:20px;padding:14px 14px 12px;text-align:center;position:relative;color:#2a1d00;box-shadow:var(--shadow);margin:12px 0;background:linear-gradient(160deg,#fbe9a0,#d4a52f 60%,#a87b14)}
.fcard.silver{background:linear-gradient(160deg,#f2f5f9,#b8c2d0 60%,#8793a6);color:#1c2433}
.fcard.bronze{background:linear-gradient(160deg,#f3c9a0,#c08550 60%,#8a5428);color:#2b1606}
.fcard .top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:0}
.fcard .ovr{font-family:var(--display);font-size:58px;line-height:.9}
.fcard .role{font-weight:800;font-size:11.5px;letter-spacing:.5px;line-height:1.3}
.fcard .av{width:76px;height:76px;font-size:28px;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.fcard .nm{font-family:var(--display);font-size:24px;margin:6px 0 8px;border-top:1px solid rgba(0,0,0,.2);border-bottom:1px solid rgba(0,0,0,.2);padding:4px 0}
.fcard .att{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 10px}
.fcard .att div{display:flex;gap:6px;align-items:baseline;justify-content:center;font-weight:700;font-size:14px}
.fcard .att b{font-family:var(--display);font-size:22px;font-weight:400}
.fcard .note{font-size:12px;margin-top:8px;opacity:.8}
.ovrb{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 3px;border-radius:999px;background:#0b0b0d;box-shadow:0 0 0 1.5px rgba(255,255,255,.18);font-family:var(--display);font-size:15px;flex:none;color:#3DDC84;line-height:1}
.ovrb.pg{color:#3DDC84}.ovrb.py{color:#F7D23E}.ovrb.po{color:#FF8C3A}.ovrb.pr{color:#FF4B4B}
.ovrb.silver{background:#b8c2d0;color:#1c2433}.ovrb.bronze{background:#c08550;color:#2b1606}
.cropbox{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#000;touch-action:none;user-select:none;cursor:grab}
.cropbox img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;-webkit-user-drag:none}
.cropbox .mask{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8)}

function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');S.leagues=d.leagues||{};S.rounds=d.rounds||{};S.photos=d.photos||{};S.ratings=d.ratings||{}}catch(e){}}

const store={db:null,queue:{},busy:{},dead:new Set(),
  put(col,obj){if(this.dead.has(col+'/'+obj.id))return;S[COLS[col]][obj.id]=obj;render();
    if(!this.db){saveLocal();return}
    const key=col+'/'+obj.id;this.queue[key]=clone(obj);this.flush(col,obj.id)},
  async flush(col,id){const key=col+'/'+id;if(this.busy[key])return;this.busy[key]=true;
    try{while(this.queue[key]){const d=this.queue[key];delete this.queue[key];
      try{await this.db.collection(col).doc(id).set(d)}
      catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await this.db.collection(col).doc(id).set(d)}catch(e2){writeErr(e2)}}else writeErr(e)}}}
    finally{this.busy[key]=false}},
  async del(col,id){const key=col+'/'+id;this.dead.add(key);delete this.queue[key];delete S[COLS[col]][id];render();if(!this.db){saveLocal();return}
    for(let i=0;i<100&&this.busy[key];i++)await new Promise(r=>setTimeout(r,50));
    try{await this.db.collection(col).doc(id).delete()}catch(e){writeErr(e)}},

function writeErr(e){

    Object.keys(S[k]).forEach(id=>{if(store.pending(col,id)&&!m[id])m[id]=S[k][id]});

  e=>{toast('החיבור לנתונים נקטע. רענן את הדף.')})}

  const c0=t+.15,cE=c0+3.7;const cv=ctx.createGain();cv.gain.setValueAtTime(0,c0);cv.gain.linearRampToValueAtTime(1,c0+.05);cv.gain.setValueAtTime(1,cE-.5);cv.gain.linearRampToValueAtTime(0,cE);

/* ---------- model helpers ---------- */
const L=()=>S.leagues[S.lid];
const saveLeague=l=>store.put('leagues',l);
const saveRound=r=>{if(S.admin)try{updateRatings(r)}catch(e){}store.put('rounds',r)};
function leagueRounds(lid){return Object.values(S.rounds).filter(r=>r.leagueId===lid).sort((a,b)=>a.created-b.created)}
function activeRound(lid){return leagueRounds(lid).filter(r=>r.status!=='done').pop()}
function pName(l,pid){const p=(l.players||[]).find(x=>x.id===pid);return p?p.name:'שחקן'}
function team(r,tid){return r.teams.find(t=>t.id===tid)||{id:tid,name:'קבוצה',color:'#888',players:[]}}
function teamOf(r,pid){return r.teams.find(t=>t.players.includes(pid))}
function avHtml(l,pid){const ph=S.photos[pid];const d=ph&&typeof ph.data==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(ph.data)?ph.data:null;return d?`<img src="${d}" alt="">`:esc(initials(pName(l,pid)))}
function rdoc(lid){return S.ratings[lid]||{id:lid,r:{},rounds:{}}}
function baseRating(lid,pid){const v=(rdoc(lid).r||{})[pid];return typeof v==='number'?v:null}
function roundRating(r,pid){const d=rdoc(r.leagueId);const o=d.rounds&&d.rounds[r.id]?d.rounds[r.id][pid]:undefined;return typeof o==='number'?o:baseRating(r.leagueId,pid)}
const rv=v=>v==null?3:v;
function setRating(lid,pid,v,roundId){const d=clone(rdoc(lid));d.r=d.r||{};d.rounds=d.rounds||{};if(roundId)(d.rounds[roundId]=d.rounds[roundId]||{})[pid]=v;else d.r[pid]=v;store.put(RCOL,d)}
function nextStar(cur,v){return cur===v?v-0.5:v}
function stars(v,act,attrs,sm){let h='';for(let i=1;i<=5;i++){const w=v==null?0:Math.max(0,Math.min(1,v-(i-1)))*100;
  h+=act?`<button class="st" data-act="${act}" ${attrs} data-v="${i}" aria-label="${i} כוכבים"><span class="f" style="width:${w}%"></span></button>`:`<span class="st"><span class="f" style="width:${w}%"></span></span>`}
  return `<span class="stars${sm?' sm':''}" aria-label="דירוג ${v==null?'לא נקבע':v}">${h}</span>`}
function teamAvg(r,t){return t.players.length?t.players.reduce((s,p)=>s+rv(roundRating(r,p)),0)/t.players.length:0}
const gkOf=t=>t.gk&&t.players.includes(t.gk)?t.gk:null;
const hasGk=t=>!!gkOf(t);
function seasons(l){const s=new Set(leagueRounds(l.id).map(r=>r.season));s.add(l.season);return [...s]}

function score(m){let h=0,a=0;(m.events||[]).forEach(e=>{if(e.type==='goal'){e.team===m.home?h++:a++}else if(e.type==='own'){e.team===m.home?a++:h++}});return [h,a]}
function elapsed(m){const t=m.timer||{};return (t.acc||0)+(t.run?Date.now()-t.since:0)}
function clockText(m){const rem=Math.max(0,m.dur*60000-elapsed(m));const s=Math.ceil(rem/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
const minuteOf=m=>Math.floor(elapsed(m)/60000)+1;
const other=(m,tid)=>tid===m.home?m.away:m.home;

function teamStats(r,live){const st={};r.teams.forEach(t=>st[t.id]={id:t.id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  r.matches.filter(m=>m.status==='done'||(live&&m.status==='live')).forEach(m=>{const [h,a]=score(m);const H=st[m.home],A=st[m.away];if(!H||!A)return;
    H.p++;A.p++;H.gf+=h;H.ga+=a;A.gf+=a;A.ga+=h;
    if(h>a){H.w++;A.l++;H.pts+=3}else if(h<a){A.w++;H.l++;A.pts+=3}else{H.d++;A.d++;H.pts++;A.pts++}});return st}
function h2h(r,x,y){let p=0;r.matches.filter(m=>m.status==='done'&&((m.home===x&&m.away===y)||(m.home===y&&m.away===x))).forEach(m=>{const [h,a]=score(m);const gx=m.home===x?h:a,gy=m.home===x?a:h;p+=gx>gy?3:gx===gy?1:0});return p}
function standings(r,live){const arr=Object.values(teamStats(r,live));const mo=r.manualOrder||[];const ix=id=>{const i=mo.indexOf(id);return i<0?999:i};
  const base=(a,b)=>(b.pts-a.pts)||((b.gf-b.ga)-(a.gf-a.ga))||(b.gf-a.gf)||(h2h(r,b.id,a.id)-h2h(r,a.id,b.id));
  const kr=r.koRank||[];const ki=id=>{const i=kr.indexOf(id);return i<0?999:i};arr.sort((a,b)=>(kr.length?ki(a.id)-ki(b.id):0)||base(a,b)||(ix(a.id)-ix(b.id)));
  arr.forEach((x,i)=>{x.tied=i>0&&base(arr[i-1],x)===0;x.manual=x.tied&&ix(arr[i-1].id)<999&&ix(x.id)<999});return arr}
function unresolvedTie(r){const s=standings(r);for(let i=1;i<=Math.min(2,s.length-1);i++){if(s[i].tied&&!s[i].manual&&s[i].p>0&&s[i-1].p>0)return [s[i-1].id,s[i].id]}return null}

function playerStats(rounds){const st={};const g=id=>st[id]||(st[id]={goals:0,assists:0,own:0,gkm:0,conc:0,yellow:0,red:0,disc:0});
  rounds.forEach(r=>r.matches.forEach(m=>{(m.events||[]).forEach(e=>{
      if(e.type==='goal'){g(e.p).goals++;if(e.a)g(e.a).assists++;if(e.gka&&m.status==='done')g(e.gka).conc++}
      else if(e.type==='own'){g(e.p).own++;if(e.gka&&m.status==='done')g(e.gka).conc++}
      else if(e.type==='card'){const x=g(e.p);if(e.c==='y')x.yellow++;else if(!e.second)x.red++;else x.red++;x.disc=x.yellow+3*x.red}});
    if(m.status==='done'&&m.gk0)Object.values(m.gk0).forEach(pid=>{if(pid)g(pid).gkm++})}));return st}
function adjOf(l,season){return ((l.adjust||{})[season])||{}}
function seasonStats(l,season){const st=playerStats(leagueRounds(l.id).filter(r=>r.status==='done'&&r.season===season));const adj=adjOf(l,season);
  Object.entries(adj).forEach(([id,a])=>{const x=st[id]||(st[id]={goals:0,assists:0,own:0,gkm:0,conc:0});x.goals+=+a.goals||0;x.assists+=+a.assists||0});return st}
function annual(l,season,liveR){const pts1=+l.settings.pts1||3,pts2=+l.settings.pts2||1;
  const rs=leagueRounds(l.id).filter(r=>r.status==='done'&&r.season===season);const rows={};
  if(liveR&&liveR.status!=='done'&&liveR.season===season&&liveR.matches.length)rs.push(liveR);
  const row=id=>rows[id]||(rows[id]={id,rounds:0,titles:0,seconds:0,pts:0});
  rs.forEach(r=>{if(r.voided)return;(r.attendees||[]).forEach(p=>row(p).rounds++);const s=standings(r,r===liveR);
    if(s[0])team(r,s[0].id).players.forEach(p=>{row(p).titles++;row(p).pts+=pts1});
    if(s[1])team(r,s[1].id).players.forEach(p=>{row(p).seconds++;row(p).pts+=pts2})});
  const ps=playerStats(rs);
  const adj=adjOf(l,season);Object.keys(adj).forEach(id=>{if(l.players.some(p=>p.id===id))row(id)});
  const list=Object.values(rows).map(x=>{const a=adj[x.id]||{};const st=ps[x.id]||{};const o=Object.assign(x,{goals:(st.goals||0)+(+a.goals||0),assists:(st.assists||0)+(+a.assists||0),own:st.own||0});
    o.titles+=+a.titles||0;o.seconds+=+a.seconds||0;o.rounds+=+a.rounds||0;o.pts+=(+a.titles||0)*pts1+(+a.seconds||0)*pts2+(+a.bonus||0)+o.goals+o.assists;o.avg=o.rounds?o.pts/o.rounds:0;return o});
  list.sort((a,b)=>b.pts-a.pts||b.titles-a.titles||b.avg-a.avg||b.goals-a.goals);return {list,rounds:rs,ps}}

function seasonSummary(l,season){const {list}=annual(l,season);const rs=leagueRounds(l.id).filter(r=>r.status==='done'&&r.season===season);const top=k=>{const x=list.slice().sort((a,b)=>(b[k]||0)-(a[k]||0))[0];return x&&x[k]?{p:x.id,v:x[k]}:null};

  return {champion:list[0]?{p:list[0].id,v:list[0].pts}:null,second:list[1]?{p:list[1].id,v:list[1].pts}:null,third:list[2]?{p:list[2].id,v:list[2].pts}:null,scorer:top('goals'),assister:top('assists'),mvp:mv?{p:mv[0]}:null,gk:gk?{p:gk[0]}:null,rounds:seasonRoundsPlayed(l,season)}}

const COLOR_EMOJI={'#3BA7F5':'🔵','#EF4B4B':'🔴','#F7D23E':'🟡','#41C46B':'🟢','#F4F6FA':'⚪','#FF8C3A':'🟠','#A77BFF':'🟣','#2A2F3A':'⚫'};

function teamsCanvas(l,r){const tf=r.teams.filter(t=>t.players.length);const assigned=new Set(tf.flatMap(t=>t.players));const pool=(r.attendees||[]).filter(p=>!assigned.has(p));

  x.direction='rtl';x.textAlign='right';x.fillStyle='#55C2FF';x.font='34px "Secular One", Assistant, sans-serif';x.fillText('⚽ Chutbol',W-50,76);

/* ---------- competition formats: fixtures (round robin, 1 or 2 legs) and knockout, with matches on parallel pitches ---------- */
function isFx(r){return r&&(r.format==='fixtures'||r.format==='knockout')}
function rrFixtures(ids,legs){const t=ids.slice();if(t.length%2)t.push(null);const n=t.length,out=[];
  for(let k=0;k<n-1;k++){for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)out.push({id:uid(),home:k%2?b:a,away:k%2?a:b,stage:'סבב '+(k+1)})}t.splice(1,0,t.pop())}
  if(legs===2){const n1=out.length;out.slice(0,n1).forEach((f,i)=>out.push({id:uid(),home:f.away,away:f.home,stage:'סבב '+(n-1+(+f.stage.split(' ')[1]))}))}return out}

function koDecide(cb){const [r,m]=gm();if(r.format==='knockout'){const [h,a]=score(m);if(h===a){choose('תיקו: מי עלתה בפנדלים?',[m.home,m.away].map(t=>({label:team(r,t).name,icon:'🎯',fn:()=>{const [r2,m2]=gm();m2.koWinner=t;saveRound(r2);cb()}})));return}}cb()}
function fxAfter(l,r,m){const f=(r.fixtures||[]).find(x=>x.mid===m.id);if(!f)return;f.done=true;
  if(r.format==='knockout'){const [h,a]=score(m);f.winner=m.koWinner||(h>a?m.home:m.away);const stage=f.ko||1;const cur=r.fixtures.filter(x=>(x.ko||1)===stage);

      else{r.fixtures=r.fixtures.concat(koStage(win,stage+1));toast('נוצר שלב: '+koName(win.length))}}}}
function fxStart(fid){const r=curRound();const l=L();const f=(r.fixtures||[]).find(x=>x.id===fid);if(!f||f.mid||!f.away)return;

  const m={id:uid(),n:r.matches.length+1,home:f.home,away:f.away,dur:+l.settings.minutes||7,status:'live',timer:{run:true,since:Date.now(),acc:0},events:[],pitch,fx:f.id,

function fixturesBoard(l,r){const live=r.matches.filter(m=>m.status==='live');const busy=new Set(live.flatMap(m=>[m.home,m.away]));const free=(r.pitches||1)-live.length;
  const nm=t=>t?`<i class="dot" style="--c:${team(r,t).color}"></i> ${esc(team(r,t).name)}`:'<span class="muted">עולה ישר</span>';
  const stages=[];(r.fixtures||[]).forEach(f=>{let g=stages.find(x=>x.k===(f.ko||0)+'|'+f.stage);if(!g){g={k:(f.ko||0)+'|'+f.stage,name:f.stage,fs:[]};stages.push(g)}g.fs.push(f)});

    <div class="card"><h3>${r.format==='knockout'?'🏆 עץ הנוקאאוט':'📅 לוח המשחקים'}</h3><p class="muted small" style="margin-top:-4px">${done} מתוך ${(r.fixtures||[]).filter(f=>f.away).length} משחקים שוחקו · ${r.pitches||1} ${(r.pitches||1)>1?'מגרשים':'מגרש'}${S.admin&&free>0?' · אפשר להתחיל '+free+(free>1?' משחקים':' משחק'):''}</p>
    ${stages.map(g=>`<h4 style="margin:12px 0 4px">${esc(g.name)}</h4><ul class="evlist">${g.fs.map(row).join('')}</ul>`).join('')}
    ${r.koRank&&r.koRank.length?`<p style="margin:12px 0 0;font-weight:800">🏆 ${esc(team(r,r.koRank[0]).name)} · 🥈 ${esc(team(r,r.koRank[1]).name)}</p>`:''}</div>`}
function finishInfo(l,r){if(isFx(r)){const fs=r.fixtures||[];const all=fs.length&&fs.every(f=>f.done||f.away==null)&&(r.format!=='knockout'||(r.koRank&&r.koRank.length));return all?{ok:true}:{ok:false,msg:r.format==='knockout'?'מסיימים את המחזור אחרי הגמר.':'מסיימים את המחזור אחרי שכל המשחקים בלוח שוחקו.'}}const minM=l.settings.minMatches==null?10:+l.settings.minMatches,minH=l.settings.minHours==null?2:+l.settings.minHours;
  const st=Object.values(teamStats(r)).map(x=>x.p).sort((a,b)=>b-a);const okM=st.length>=2&&st[1]>=minM;
  const first=r.matches.map(m=>m.startedAt).filter(Boolean).sort()[0]||(r.matches.length?r.liveStart||r.created:null);
  const elapsedMs=first?Date.now()-first:0;const okH=!!first&&elapsedMs>=minH*3600000;
  if(!r.matches.some(m=>m.status==='done'))return {ok:false,msg:'אפשר לסיים מחזור אחרי שמשחקים לפחות משחק אחד.'};

function roundSummary(l,r,withResults){const s=standings(r);const ch=s[0]&&!r.voided?team(r,s[0].id):null;const ps=playerStats([r]);

/* match results under the round table: score, who scored and assisted, and a shortcut to the match ratings */
/* four compact boards, two by two: top scorer, top assister, player of the round, goalkeeper of the round */
function miniBoards(l,r,ps){const top=(arr,fmt)=>arr.length?arr.slice(0,3).map(([p,v],i)=>`<li><span class="mb-i">${i+1}</span><span class="grow mb-n">${esc(pName(l,p))}</span><b>${fmt(v)}</b></li>`).join(''):'<li class="muted small">עוד אין</li>';
  const by=k=>Object.entries(ps).filter(([,x])=>x[k]>0).sort((a,b)=>b[1][k]-a[1][k]).map(([p,x])=>[p,x[k]]);
  const F=Object.entries(roundScores(r,'field')).sort((a,b)=>b[1].score-a[1].score).map(([p,x])=>[p,x.score]);const G=Object.entries(roundScores(r,'gk')).sort(gkSort).map(([p,x])=>[p,x.score]);

  return `<div class="mbgrid">${box('👑 מלך השערים',top(by('goals'),v=>v),'goals')}${box('👟 מלך הבישולים',top(by('assists'),v=>v),'assists')}${box('⭐ שחקן מצטיין',top(F,v=>v.toFixed(2)),'mvp')}${box('🧤 שוער מצטיין',top(G,v=>v.toFixed(2)),'gk')}</div>`}
/* payments for the evening: who paid, visible to everyone; only the manager can mark */
/* in the "who's coming" screen: who already paid, next to the attendance */
/* a fixed payment link (Bit, PayBox...) kept in the league settings until the manager changes it */
/* running balance per player across all rounds: what he paid minus the fee of every evening he came to.

function feeOf(l,r){return r.fee!=null?+r.fee:(+l.settings.fee||0)}

    let att=0,elig=0,last=0;rs.forEach(r=>{const t=roundDate(r);if(fz.some(f=>t>=f.from&&t<=f.to))return;elig++;if((r.attendees||[]).includes(p.id)){att++;last=Math.max(last,t)}});

  ${S.admin?`<div class="row" style="margin-top:12px"><input id="newNames" type="text" placeholder="שמות, מופרדים בפסיק" autocomplete="off"><button class="btn" data-act="addNames">הוסף</button></div>`:''}
  <div class="spacer"></div>
  ${S.admin&&ps.length?`<div class="seg" style="margin-bottom:6px"><button class="${S.squadSort!=='rating'?'on':''}" data-act="squadSort" data-s="name">לפי שם</button><button class="${S.squadSort==='rating'?'on':''}" data-act="squadSort" data-s="rating">כוכבים</button><button class="${S.squadSort==='ovr'?'on':''}" data-act="squadSort" data-s="ovr">ציון כולל</button><button class="${S.squadSort==='prio'?'on':''}" data-act="squadSort" data-s="prio">עדיפות</button></div>
    <p class="muted small" style="margin:0 0 4px">לחיצה על כוכב קובעת דירוג. לחיצה נוספת על אותו כוכב נותנת חצי.${S.mode==='db'?' הדירוג גלוי רק לך.':''}</p>`:''}
  ${S.squadSort==='prio'&&S.admin?prioHtml(l):ps.length?`<div>${ps.map(p=>{const v=baseRating(l.id,p.id);return `<div class="prow2"><button class="pbtn" data-act="player" data-p="${p.id}"><span class="av mini">${avHtml(l,p.id)}</span>${ovrBadge(l,p.id)}<span class="pn">${p.gk?'🧤 ':''}${esc(p.name)}${p.guest?' <small class="muted">אורח</small>':''}</span></button>${S.admin?`${stars(v,'rate',`data-p="${p.id}"`)}<span class="rnum">${v==null?'–':v.toFixed(1)}</span>`:''}</div>`}).join('')}</div>`:'<div class="empty">הוסף את השחקנים של הליגה. אפשר כמה שמות יחד.</div>'}</div>`}

function viewPlayer(l,pid){const p=(l.players||[]).find(x=>x.id===pid);if(!p){S.player=null;return tabSquad(l)}
  const season=S.season||l.season;const {list}=annual(l,season);const row=list.find(x=>x.id===pid)||{pts:0,titles:0,seconds:0,rounds:0,goals:0,assists:0,own:0};
  const rs=leagueRounds(l.id).filter(r=>(r.attendees||[]).includes(pid)||r.matches.some(m=>(m.events||[]).some(e=>e.p===pid||e.a===pid||e.in===pid))).reverse();
  return `<div class="card"><div class="row" style="align-items:flex-start"><div class="pcol">${avZoom(l,pid,"big")}${ovrBadge(l,pid)}</div><div class="grow"><h2>${esc(p.name)}</h2><span class="muted small">${esc(season)}${p.gk?', שוער':''}${p.guest?', אורח':''}${p.core?', ⭐ קבוע':''}</span>${p.freeze?`<div class="small" style="margin-top:4px;color:#7cc8ff">❄️ מוקפא מ-${fmtDate(p.freeze.since)}${p.freeze.reason?': '+esc(p.freeze.reason):''}</div>`:''}${S.admin?`<div class="row wrap" style="gap:6px;margin-top:6px"><button class="btn ${p.core?'':'soft'} sm" data-act="pCore" data-p="${pid}">⭐ ${p.core?'קבוע':'סמן כקבוע'}</button><button class="btn soft sm" data-act="pFreeze" data-p="${pid}">${p.freeze?'▶ בטל הקפאה':'❄️ הקפאה'}</button></div>`:''}${S.admin?`<div class="row" style="gap:6px;margin-top:4px">${stars(baseRating(l.id,pid),'rate',`data-p="${pid}"`)}<span class="rnum">${baseRating(l.id,pid)==null?'–':baseRating(l.id,pid).toFixed(1)}</span></div>`:''}</div>${(()=>{const cs=pCards(l,pid);if(!S.admin&&!cs.length)return '';return `<div class="pcards">${Object.entries(CARD_L).filter(([c])=>S.admin||cs.includes(c)).map(([c,t])=>S.admin?`<button class="chip ${cs.includes(c)?'on':''}" data-act="pCard" data-p="${pid}" data-c="${c}" aria-pressed="${cs.includes(c)}">${t}</button>`:`<span class="chip on">${t}</span>`).join('')}</div>`})()}</div>
    <div class="statgrid"><div class="stat"><b>${row.pts}</b><span>נקודות</span></div><div class="stat"><b>${row.titles}</b><span>אליפויות מחזור</span></div><div class="stat"><b>${row.seconds}</b><span>מקום שני</span></div>
    <div class="stat"><b>${row.rounds}</b><span>מחזורים</span></div><div class="stat"><b>${row.goals||0}</b><span>שערים</span></div><div class="stat"><b>${row.assists||0}</b><span>בישולים</span></div></div>${(()=>{const rs=leagueRounds(l.id).filter(r=>r.status==='done'&&r.season===season);const f=ratingAgg(rs,'field')[pid],g=ratingAgg(rs,'gk')[pid];if(!f&&!g)return '';
    return `<div class="statgrid" style="grid-template-columns:1fr 1fr">${f?`<div class="stat"><b>${f.avg.toFixed(2)}</b><span>⭐ ציון משחק ממוצע כשחקן (${f.n} משחקים)</span></div>`:''}${g?`<div class="stat"><b>${g.avg.toFixed(2)}</b><span>🧤 ציון משחק ממוצע כשוער (${g.n} משחקים)</span></div>`:''}</div>`})()}</div>
  ${ovrCard(l,pid,'f')}${ovrCard(l,pid,'g')}${S.admin&&!playerOVR(l,pid,'f')&&!playerOVR(l,pid,'g')?`<button class="btn soft wide" style="margin:10px 0" data-act="ovrEdit" data-p="${pid}" data-role="f">✏️ קבע ציון כולל ידני</button>`:''}${playerMomentsFromRound(l,pid)}${playerClipsCard(l,pid)}${playerMomentsCard(l,pid,season)}<div class="card"><h3>מחזור אחר מחזור</h3>${rs.length?`<ul class="evlist">${rs.map(r=>{const t=teamOf(r,pid);const s=standings(r);const pos=t?s.findIndex(x=>x.id===t.id)+1:0;const st=playerStats([r])[pid]||{goals:0,assists:0};
    return `<li class="click" data-act="openRound" data-r="${r.id}" style="cursor:pointer"><span class="min">${r.number}</span><span class="grow">${t?`<i class="dot" style="--c:${t.color}"></i> ${esc(t.name)}`:'אורח'}${r.status==='done'&&pos?`, מקום ${pos}`:r.status!=='done'?', פעיל':''}</span><span>${st.goals?'⚽'+st.goals:''} ${st.assists?'👟'+st.assists:''}</span></li>`}).join('')}</ul>`:'<div class="empty">עוד לא שיחק.</div>'}</div>
  ${S.admin?`<div class="row wrap" style="margin-bottom:10px"><label class="btn soft grow" style="cursor:pointer">📷 ${S.photos[pid]?'החלף תמונה':'הוסף תמונה'}<input type="file" accept="image/*" data-chg="photo" data-p="${pid}" hidden></label>${S.photos[pid]?`<button class="btn ghost" data-act="delPhoto" data-p="${pid}">הסר תמונה</button>`:''}</div><div class="row wrap"><button class="btn soft grow" data-act="renamePlayer" data-p="${pid}">שנה שם</button><button class="btn soft grow" data-act="toggleGk" data-p="${pid}">${p.gk?'בטל שוער קבוע':'סמן כשוער קבוע'}</button></div><div class="spacer"></div><button class="btn ghost wide" style="color:var(--bad)" data-act="deletePlayer" data-p="${pid}">הסר מהסגל</button>`:''}`}

/* ----- history ----- */
function tabHistory(l){const all=leagueRounds(l.id).filter(r=>r.status==='done').reverse();const done=l.seasonsDone||{};
  if(S.histSeason){const se=S.histSeason;const rs=all.filter(r=>r.season===se);const sm=done[se]||seasonSummary(l,se);const nm=x=>x?esc(pName(l,x.p)):'–';
    return `<button class="btn ghost sm" data-act="histBack" style="margin-bottom:8px">→ כל העונות</button><h2>${done[se]?'🏁 ':''}${esc(se)}</h2>
      <div class="card"><ul class="evlist"><li>🏆 אלוף העונה: <b>${nm(sm.champion)}</b>${sm.champion?' <span class="muted small">'+sm.champion.v+' נק׳</span>':''}</li><li>🥈 מקום שני: <b>${nm(sm.second)}</b></li><li>⚽ מלך השערים: <b>${nm(sm.scorer)}</b></li><li>👟 מלך הבישולים: <b>${nm(sm.assister)}</b></li><li>⭐ השחקן המצטיין: <b>${nm(sm.mvp)}</b></li><li>🧤 השוער המצטיין: <b>${nm(sm.gk)}</b></li></ul><p class="muted small" style="margin:6px 0 0">${sm.rounds} מחזורים${done[se]?', הסתיימה ב-'+fmtDate(done[se].endedAt):''}. הטבלה המלאה: בלשונית טבלה, בחירת עונה.</p></div>
      ${histList(l,rs,'מחזורי העונה')}`}
  const cur=all.filter(r=>r.season===l.season);const seasons=[...new Set([...Object.keys(done),...all.map(r=>r.season)])].filter(x=>x!==l.season);
  return `${histList(l,cur,'מחזורים קודמים, '+l.season)}${seasons.length?`<div class="card"><h3>עונות קודמות</h3>${seasons.map(se=>{const sm=done[se]||seasonSummary(l,se);return `<button class="vthumb" style="aspect-ratio:auto;padding:14px 16px;margin:8px 0;background:linear-gradient(120deg,#3a2c00,#0B1838 60%);text-align:right" data-act="histSeason" data-s="${esc(se)}"><b style="font-size:18px">🏁 ${esc(se)}</b><br><span class="small" style="opacity:.85">${sm.rounds} מחזורים${sm.champion?' · 🏆 '+esc(pName(l,sm.champion.p)):''}</span></button>`}).join('')}</div>`:''}`}
function histList(l,rs,title){
  return `<div class="card"><h3>${esc(title)}</h3>${rs.length?`<ul class="evlist">${rs.map(r=>{const s=standings(r);const ch=s[0]&&!r.voided?team(r,s[0].id):null;const ps=playerStats([r]);const top=Object.entries(ps).sort((a,b)=>b[1].goals-a[1].goals)[0];
    return `<li data-act="openRound" data-r="${r.id}" style="cursor:pointer"><span class="min">${r.number}</span><span class="grow"><b>${ch?`<i class="dot" style="--c:${ch.color}"></i> ${esc(ch.name)}`:r.voided?'הופסק בלי נקודות':''}</b><br><span class="muted small">${esc(r.season)}, ${fmtDate(roundDate(r))}, ${r.matches.length} משחקים${top&&top[1].goals?`, מלך השערים ${esc(pName(l,top[0]))}`:''}</span></span>${ic.back.replace('M9 5l7 7-7 7','M15 5l-7 7 7 7')}</li>`}).join('')}</ul>`:'<div class="empty">מחזורים שהסתיימו יופיעו כאן.</div>'}</div>`}

/* ----- manual adjustments ----- */
const ADJ=[['titles','🥇 אליפויות מחזור'],['seconds','🥈 מקום שני'],['rounds','מחזורים ששיחק'],['goals','⚽ שערים'],['assists','👟 בישולים'],['bonus','תיקון נקודות (±)']];
function viewAdjust(l){const season=l.season;const adj=adjOf(l,season);const off=+((l.roundOffset||{})[season])||0;
  const ps=(l.players||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'he'));const p1=+l.settings.pts1||3,p2=+l.settings.pts2||1;
  return `<h2>עדכון ידני, ${esc(season)}</h2>
  <div class="card"><div class="stepper"><b>מחזורים ששוחקו לפני האפליקציה</b><div class="ctl"><button class="iconbtn" data-act="offset" data-d="-1" aria-label="פחות">−</button><span class="val">${off}</span><button class="iconbtn" data-act="offset" data-d="1" aria-label="יותר">+</button></div></div>
  <p class="muted small" style="margin:0">המחזור הבא שתפתח יהיה מחזור ${leagueRounds(l.id).filter(r=>r.season===season).length+1+off}.</p></div>
  <div class="card"><h3>לפי שחקן</h3><p class="muted small" style="margin-top:-4px">הנקודות מחושבות לבד: ${p1} לכל אליפות ו-${p2} לכל מקום שני. "תיקון נקודות" רק למקרים חריגים.</p>
  ${ps.map(p=>{const a=adj[p.id]||{};const has=ADJ.some(([k])=>+a[k]);const pts=(+a.titles||0)*p1+(+a.seconds||0)*p2+(+a.bonus||0);
    return `<div class="prow2"><button class="pbtn" data-act="adjPlayer" data-p="${p.id}"><span class="av mini">${avHtml(l,p.id)}</span><span class="pn">${esc(p.name)}</span></button>
    <span class="small muted" style="white-space:nowrap">${has?`🥇${+a.titles||0} 🥈${+a.seconds||0} ⚽${+a.goals||0} 👟${+a.assists||0}`:'אין'}</span><span class="rnum" style="color:var(--gold)">${has?pts:''}</span></div>`}).join('')}</div>`}
function adjSheet(pid){const l=L();const a=adjOf(l,l.season)[pid]||{};
  sheet(`<h3>${esc(pName(l,pid))}</h3><p class="muted small" style="margin:-4px 0 8px">נתונים מלפני האפליקציה, ${esc(l.season)}</p>
  ${ADJ.map(([k,t])=>`<div class="stepper"><b>${t}</b><div class="ctl"><button class="iconbtn" data-act="adjStep" data-p="${pid}" data-k="${k}" data-d="-1" aria-label="פחות">−</button><span class="val">${+a[k]||0}</span><button class="iconbtn" data-act="adjStep" data-p="${pid}" data-k="${k}" data-d="1" aria-label="יותר">+</button></div></div>`).join('')}
  <p class="small" style="margin:8px 0">סך נקודות מהעדכון: <b class="tavg">${(+a.titles||0)*(+l.settings.pts1||3)+(+a.seconds||0)*(+l.settings.pts2||1)+(+a.bonus||0)}</b></p>
  <button class="btn wide" data-act="closeSheet">סיום</button>`)}
/* ----- settings ----- */
function viewSettings(l){const s=l.settings;
  return `<div class="card"><h3>הגדרות ליגה</h3>
  <label class="f" for="s_name">שם הליגה</label><input id="s_name" type="text" value="${esc(l.name)}">
  <label class="f" for="s_season">שם העונה</label><input id="s_season" type="text" value="${esc(l.season)}">
  <div class="row"><div class="grow"><label class="f" for="s_min">דקות למשחק</label><input id="s_min" type="number" min="1" max="90" value="${s.minutes}"></div>
  <div class="grow"><label class="f" for="s_per">שחקנים בקבוצה</label><input id="s_per" type="number" min="1" max="11" value="${s.perTeam}"></div></div>
  <div class="row"><div class="grow"><label class="f" for="s_p1">נק׳ לאלופת מחזור</label><input id="s_p1" type="number" min="0" max="10" value="${s.pts1}"></div>
  <div class="grow"><label class="f" for="s_p2">נק׳ למקום שני</label><input id="s_p2" type="number" min="0" max="10" value="${s.pts2}"></div></div>
  <label class="f" for="s_goal">סיום משחק</label><select id="s_goal">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${(s.goalLimit==null?2:+s.goalLimit)===n?'selected':''}>${n?`בסוף הזמן או כשקבוצה מגיעה ל-${n} ${n===1?'שער':'שערים'}`:'רק בסוף הזמן'}</option>`).join('')}</select>
  <div class="row"><div class="grow"><label class="f" for="s_mm">משחקים לסיום מחזור</label><input id="s_mm" type="number" min="1" max="50" value="${s.minMatches==null?10:s.minMatches}"></div>
  <div class="grow"><label class="f" for="s_mh">או שעות מתחילת המחזור</label><input id="s_mh" type="number" min="0.5" max="12" step="0.5" value="${s.minHours==null?2:s.minHours}"></div></div>
  <label class="f" for="s_skin">עיצוב</label><select id="s_skin" data-chg="skin"><option value="night" ${!s.skin||s.skin==='night'?'selected':''}>כחול לילה (כמו ליגת הסוני)</option><option value="grass" ${s.skin==='grass'?'selected':''}>ירוק דשא</option><option value="ucl" ${s.skin==='ucl'?'selected':''}>סגול ליגת האלופות</option></select>
  <label class="f" for="s_lead">שניות לפני גול בתקציר</label><input id="s_lead" type="number" min="0" max="60" value="${s.lead==null?10:s.lead}">
  <label class="f" for="s_tie">בתיקו, מי יוצאת?</label><select id="s_tie"><option value="fewer" ${s.tieRule!=='both'?'selected':''}>מי ששיחקה יותר משחקים. אם שווה, מי ששיחקה פעמיים ברצף</option><option value="both" ${s.tieRule==='both'?'selected':''}>שתי הקבוצות יוצאות</option></select>
  <p class="muted small">אחרי ניצחון: המנצחת נשארת, המפסידה יוצאת והממתינה נכנסת. תמיד אפשר לשנות ידנית.</p>
  <button class="btn wide" data-act="saveSettings">שמור הגדרות</button></div>
  <div class="card"><h3>ייבוא שחקנים</h3><p class="muted small" style="margin-top:0">הדבק רשימת שמות, שם בכל שורה או מופרדים בפסיק.</p><textarea id="s_import" placeholder="ישראל לוי&#10;איציק וידל"></textarea><div class="spacer"></div><button class="btn soft wide" data-act="importPlayers">ייבא לסגל</button></div>
  <div class="card"><h3>📜 חוקי הסימון</h3><p class="muted small" style="margin-top:0">ההגדרה של כל כפתור. מופיעה בתפריט בכל לחיצה, וכל החברים רואים אותה במסך המלכים.</p>
  ${RULE_ORDER.map(k=>`<label class="f" for="rule_${k}">${MOM[k][0]} ${MOM[k][1]}</label><textarea id="rule_${k}" style="min-height:70px">${esc(ruleOf(l,k))}</textarea>`).join('')}
  <div class="spacer"></div><button class="btn soft wide" data-act="saveRules">שמור חוקים</button></div>
  <div class="card"><h3>נתונים שלפני האפליקציה</h3><p class="muted small" style="margin-top:0">התחלתם את העונה לפני האפליקציה? הכנס אליפויות, מקומות שניים, שערים ובישולים לכל שחקן, והם יתווספו לטבלה השנתית.</p><button class="btn soft wide" data-act="openAdjust">עדכון ידני של ${esc(l.season)}</button></div>
  <div class="card"><h3>🛡️ סמל הליגה</h3><div class="row" style="gap:12px;align-items:center"><span class="crest logo" style="width:72px;height:72px;flex:none">${leagueCrest(l)}</span><div class="grow"><label class="btn soft sm" style="cursor:pointer">📷 מתמונה בטלפון<input type="file" accept="image/*" data-chg="crestImg" hidden></label>${l.crest?`<button class="btn ghost sm" data-act="crestPick" data-id="">ברירת מחדל</button>`:''}</div></div>
    <p class="muted small" style="margin:10px 0 6px">או בחר סמל מוכן:</p><div class="crestgrid">${['globe',...Object.keys(CRESTS)].map(id=>`<button class="crestopt ${(l.crest&&l.crest.preset||(!l.crest?'globe':''))===id?'on':''}" data-act="crestPick" data-id="${id==='globe'?'':id}" aria-label="סמל ${id}">${id==='globe'?CREST_LOGO:CRESTS[id]}</button>`).join('')}</div></div>
  <div class="card"><h3>🏆 סוג תחרות ומגרשים</h3><p class="muted small" style="margin-top:0">חל על המחזור הבא שנפתח.</p>
    <div class="seg">${[['rotation','שכונתית (המנצחת נשארת)'],['fixtures','לוח משחקים'],['knockout','נוקאאוט']].map(([v,t])=>`<button class="${(l.settings.format||'rotation')===v?'on':''}" data-act="setFmt" data-v="${v}">${t}</button>`).join('')}</div>
    ${(l.settings.format||'rotation')==='fixtures'?`<div class="seg" style="margin-top:8px">${[[1,'סיבוב אחד'],[2,'שני סיבובים']].map(([v,t])=>`<button class="${(+l.settings.legs===2?2:1)===v?'on':''}" data-act="setLegs" data-v="${v}">${t}</button>`).join('')}</div>`:''}

  /* up to 4 per row; from 9 field players up, rows of 5 (so 11 a side = goalkeeper + two rows of 5) */
  const half=(tid,cls)=>{const lu=m.lu[tid];const field=lu.on.filter(p=>p!==lu.gk);const per=field.length>8?5:4;const k=Math.max(1,Math.ceil(field.length/per));const rows=[];let i0=0;for(let j=0;j<k;j++){const sz=Math.floor(field.length/k)+(j<field.length%k?1:0);rows.push(field.slice(i0,i0+sz));i0+=sz}

/* goal of the round: every voter ranks 3 goals (3, 2 and 1 points) */
function roundGoals(r){return r.matches.filter(m=>m.status==='done').sort((a,b)=>a.n-b.n).flatMap(m=>(m.events||[]).filter(e=>e.type==='goal').sort((a,b)=>(a.at||0)-(b.at||0)).map(e=>({m,e})))}
function gotrTally(r){const pts={},firsts={};Object.values(r.goalVotes||{}).forEach(v=>(v||[]).forEach((eid,k)=>{pts[eid]=(pts[eid]||0)+[3,2,1][k];if(k===0)firsts[eid]=(firsts[eid]||0)+1}));return {pts,firsts}}
function gotrOrder(r){const valid=new Set(roundGoals(r).map(g=>g.e.id));if(Array.isArray(r.gotrOrder))return r.gotrOrder.filter(x=>valid.has(x));const {pts,firsts}=gotrTally(r);return Object.keys(pts).filter(x=>valid.has(x)).sort((a,b)=>pts[b]-pts[a]||(firsts[b]||0)-(firsts[a]||0)).slice(0,5)}
function gotrClipCard(l,r){if(!S.admin)return '';const G=roundGoals(r);const byId=Object.fromEntries(G.map(g=>[g.e.id,g]));const o=gotrOrder(r);const cd=r.gotrCountdown!==false;

/* a "watch" button for any goal: the round highlight at the right second, the copy saved on this phone, or the full match video */

  const ranked=G.map((g,i)=>({...g,i,p:pts[g.e.id]||0,f:firsts[g.e.id]||0})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p||b.f-a.f);const rc=(r.clips||[]).filter(x=>x.kind==='round').pop();const tl=(rc&&rc.tl)||(r.hlTl&&r.hlTl.tl)||[];

function gkCounts(r,tid){const t=team(r,tid);const c={};r.matches.filter(m=>(m.status==='done'||m.status==='live')&&(m.home===tid||m.away===tid)).forEach(m=>{const g=matchGks(m);const side=new Set((m.lu[tid]||{}).on||[]);[...g].filter(p=>side.has(p)&&t.players.includes(p)).forEach(p=>{c[p]=(c[p]||0)+1})});return c}

function openCropper(img,url,aspect,circle,title,onDone){CROP={img,url,aspect,zoom:1,x:0,y:0,onDone,pts:new Map()};

    box.addEventListener('pointermove',e=>{if(!CROP||!CROP.pts.has(e.pointerId))return;const prev=CROP.pts.get(e.pointerId);

function cropScale(){const c=CROP;return Math.max(c.W/c.img.naturalWidth,c.H/c.img.naturalHeight)*c.zoom}

  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('clips',mode);const st=t.objectStore('clips');const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(rec){return this.tx('readwrite',st=>st.put(rec))},get(key){return this.tx('readonly',st=>st.get(key))},del(key){return this.tx('readwrite',st=>st.delete(key))},all(){return this.tx('readonly',st=>st.getAll())}};
